name: Reusable GumTree build

on:
  workflow_call:
    inputs:
      upload_distribution:
        description: Upload the distribution ZIP for a deployment job.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GumTree
        uses: actions/checkout@v7
        with:
          submodules: recursive
          show-progress: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build and test GumTree
        run: ./gradlew build
      - name: Upload distribution
        if: ${{ inputs.upload_distribution }}
        uses: actions/upload-artifact@v7
        with:
          name: gumtree-dist
          path: dist/build/distributions/gumtree*.zip
          if-no-files-found: error
          retention-days: 30
