name: Nightly GumTree

on:
  schedule:
    - cron: '59 23 * * SUN'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-deploy
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout GumTree
        uses: actions/checkout@v7
        with:
          show-progress: ''
      - name: Read GumTree version
        id: version
        shell: bash
        run: |
          version=$(sed -n "s/^def projectsVersion = '\\([^']*\\)'.*/\\1/p" build.gradle)
          if [[ -z "$version" ]]; then
            echo "Could not determine projectsVersion from build.gradle" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[no ci]') && !startsWith(github.event.head_commit.message || '', 'doc') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      upload_distribution: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read

  benchmarks:
    if: ${{ github.event_name == 'schedule' && !contains(github.event.head_commit.message || '', '[no ci]') && !startsWith(github.event.head_commit.message || '', 'doc') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout GumTree
        uses: actions/checkout@v7
        with:
          submodules: recursive
          show-progress: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Run benchmarks
        run: ./gradlew :benchmark:runBenchmark -Pbenchmarks=d4j,ghj
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: benchmark/build/reports/benchmark/analysis.html
          if-no-files-found: error
          retention-days: 7

  publish-snapshot:
    needs: [ build, version ]
    if: ${{ github.event_name == 'schedule' && contains(needs.version.outputs.version, 'SNAPSHOT') }}
    runs-on: ubuntu-24.04
    environment: MavenCentral
    permissions:
      contents: read
    steps:
      - name: Checkout GumTree
        uses: actions/checkout@v7
        with:
          submodules: recursive
          show-progress: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Publish snapshot package
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}

  nightly-release:
    needs: [ build, version, publish-snapshot ]
    if: ${{ always() && github.event_name == 'schedule' && needs.build.result == 'success' && needs.version.result == 'success' && (needs.publish-snapshot.result == 'success' || needs.publish-snapshot.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout GumTree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: ''
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: gumtree-dist
          path: dist/build/distributions
      - name: Create nightly GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: dist/build/distributions/gumtree*.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          tag: nightly
          commit: ${{ github.sha }}
          name: Nightly distribution
          body: "Nightly distribution built from commit ${{ github.sha }}."
          prerelease: true
          makeLatest: false
      - name: Move nightly tag to current commit
        run: git push --force origin "${GITHUB_SHA}:refs/tags/nightly"

  docker:
    needs: build
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && !contains(github.event.head_commit.message || '', '[no ci]') && !startsWith(github.event.head_commit.message || '', 'doc') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout GumTree
        uses: actions/checkout@v7
        with:
          submodules: recursive
          show-progress: ''
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check Docker Hub credentials
        id: check-secrets
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: ${{ steps.check-secrets.outputs.present == 'true' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.check-secrets.outputs.present == 'true' }}
          tags: gumtreediff/gumtree:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
